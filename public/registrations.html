<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations — Evento</title>
  <script>
    (function () { try { var t = localStorage.getItem('evento_theme'); if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) { } })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/registrations.css">
</head>

<body>

  <div class="page-bg">
    <div class="blob-extra"></div>
  </div>

  <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  <div class="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-logo">
      <div class="logo-icon">🎪</div>
      <span class="logo-text">Evento</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Home
      </a>
      <a href="events.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
        Events
      </a>
      <a href="registrations.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        My Registrations
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item theme-toggle-btn"
        style="width:100%;text-align:left;background:none;border:none;cursor:pointer;"
        aria-label="Toggle dark/light mode">
        <span class="theme-toggle-icon" style="display:flex;align-items:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </span>
        <span class="theme-toggle-label">Dark mode</span>
      </button>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        About Evento
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <h1 class="topbar-title">My Registrations</h1>
      <div class="topbar-actions">
        <a href="notifications.html" class="btn-icon" aria-label="Notifications" title="Notifications">🔔</a>
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <a href="events.html" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          Browse events
        </a>
        <div class="avatar">P</div>
      </div>
    </header>

    <div class="reg-list">
      <div class="reg-list-header">
        <h2>Your upcoming events</h2>
        <button onclick="clearAllRegistrations()" class="btn-clear-all" id="clear-all-btn">Clear all</button>
      </div>
      <div id="reg-list"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/theme.js"></script>
  <script>document.documentElement.setAttribute('data-theme-ready','1');</script>
  <script src="js/notifications.js"></script>
  <script src="js/events-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/registrations.js"></script>
  <script>
    function clearAllRegistrations() {
      if (confirm('Remove all registrations?')) {
        localStorage.removeItem('evento_registrations');
        renderMyRegistrations();
        showToast('All registrations cleared.');
      }
    }

    // Show clear-all only if registrations exist
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('clear-all-btn');
      const regs = readRegistrations();
      if (btn) btn.style.display = regs.length ? 'block' : 'none';
    });
  </script>
</body>

</html>
